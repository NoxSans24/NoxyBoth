<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result — NoxBooth</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/result.css">
</head>
<body class="result-body">
    <div class="bg-glow"></div>

    <header class="app-header">
        <a href="editor.html" class="icon-btn" aria-label="Back to Editor">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <defs>
                    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3b82f6" />
                        <stop offset="100%" stop-color="#8b5cf6" />
                    </linearGradient>
                </defs>
                <path fill="url(#iconGrad)" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
        </a>
        <div class="brand-name">Your Photostrip</div>
        <div class="header-spacer"></div>
    </header>

    <main class="result-container">
        <div class="result-card-wrapper">
            <div class="result-glow"></div>
            <div id="resultCanvasContainer" class="result-canvas-container">
                <!-- Final Canvas rendered here or image element -->
            </div>
        </div>

        <div class="result-actions">
            <button id="downloadPngBtn" class="btn btn-primary btn-glow">
                <svg viewBox="0 0 24 24" width="20" height="20" class="btn-icon">
                    <path fill="url(#iconGrad)" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                </svg>
                Download PNG
            </button>
            <button id="downloadJpgBtn" class="btn btn-secondary">
                <svg viewBox="0 0 24 24" width="20" height="20" class="btn-icon">
                    <path fill="url(#iconGrad)" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                </svg>
                Download JPG
            </button>
            <a href="camera.html" id="retakeBtn" class="btn btn-outline">
                <svg viewBox="0 0 24 24" width="20" height="20" class="btn-icon">
                    <path fill="url(#iconGrad)" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                </svg>
                Retake Photos
            </a>
        </div>
    </main>

    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const dataUrl = localStorage.getItem('noxbooth_result');
            const container = document.getElementById('resultCanvasContainer');
            if (dataUrl) {
                const img = document.createElement('img');
                img.src = dataUrl;
                img.alt = 'NoxBooth Photostrip Result';
                container.appendChild(img);
            } else {
                container.innerHTML = '<p class="error-msg">No photostrip found. Please take photos first.</p>';
            }

            document.getElementById('downloadPngBtn').addEventListener('click', () => {
                if (!dataUrl) return;
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = `noxbooth-${new Date().toISOString().slice(0,10)}.png`;
                a.click();
            });

            document.getElementById('downloadJpgBtn').addEventListener('click', () => {
                if (!dataUrl) return;
                // Convert to JPG via temporary canvas
                const img = new Image();
                img.src = dataUrl;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#0f172a'; // dark navy background for jpeg
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    const jpgUrl = canvas.toDataURL('image/jpeg', 0.95);
                    const a = document.createElement('a');
                    a.href = jpgUrl;
                    a.download = `noxbooth-${new Date().toISOString().slice(0,10)}.jpg`;
                    a.click();
                };
            });
        });
    </script>
</body>
</html>
