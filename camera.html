<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera — NoxBooth</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/camera.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233b82f6'/%3E%3Crect x='5' y='8' width='14' height='10' rx='2' fill='white'/%3E%3Ccircle cx='12' cy='13' r='3' fill='%233b82f6'/%3E%3Crect x='9' y='6' width='6' height='3' rx='1' fill='white'/%3E%3C/svg%3E">
</head>
<body class="camera-body">
    <div class="bg-glow"></div>

    <header class="app-header">
        <a href="index.html" class="icon-btn" aria-label="Back to Home">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <defs>
                    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3b82f6" />
                        <stop offset="100%" stop-color="#8b5cf6" />
                    </linearGradient>
                </defs>
                <path fill="url(#iconGrad)" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
        </a>
        <div class="photo-counter" id="photoCounter">PHOTO 0 / 4</div>
        <div class="header-spacer"></div>
    </header>

    <!-- Permission Overlay -->
    <div id="permissionState" class="permission-overlay">
        <div class="permission-card glass-panel">
            <div class="permission-icon-wrap">
                <svg viewBox="0 0 24 24" width="48" height="48">
                    <path fill="url(#iconGrad)" d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4zM15 16H5V8h10v8z"/>
                </svg>
            </div>
            <h2>Camera Access Required</h2>
            <p>NoxBooth needs access to your camera to capture your wonderful moments. Please allow permission when prompted.</p>
            <button id="allowCameraBtn" class="btn btn-primary btn-glow">Allow Camera</button>
            <p id="permissionError" class="error-msg hidden"></p>
        </div>
    </div>

    <main class="camera-container">
        <div class="preview-wrapper">
            <div class="camera-glow-border"></div>
            <video id="cameraVideo" autoplay playsinline muted></video>
            
            <!-- Countdown Overlay -->
            <div id="countdownOverlay" class="countdown-overlay hidden">
                <span id="countdownNumber">3</span>
            </div>

            <!-- Flash Overlay -->
            <div id="flashOverlay" class="flash-overlay"></div>
        </div>

        <!-- Capture Error Message (outside #permissionState so it stays visible after camera init) -->
        <p id="captureError" class="error-msg hidden"></p>

        <div class="count-selector hidden" id="countSelector">
            <button class="count-btn" data-count="4">4</button>
            <button class="count-btn" data-count="6">6</button>
            <button class="count-btn" data-count="8">8</button>
            <button class="count-btn" data-count="10">10</button>
        </div>

        <div class="progress-indicator"></div>

        <div class="camera-controls">
            <button id="flashToggle" class="control-btn" aria-label="Toggle Flash">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="url(#iconGrad)" d="M7 2v11h3v9l7-12h-4l4-8z"/>
                </svg>
            </button>

            <button id="captureBtn" class="capture-btn" aria-label="Capture Photo">
                <div class="capture-inner"></div>
            </button>

            <button id="flipCameraBtn" class="control-btn" aria-label="Flip Camera">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="url(#iconGrad)" d="M20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
            </button>
        </div>

        <!-- Mini Previews Strip -->
        <div id="miniPreviews" class="mini-previews"></div>
    </main>

    <script src="js/camera.js"></script>
    <script src="js/capture.js"></script>
    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
